[package]
name    = "zk-octopus"
version = "0.1.0"
edition = "2021"
description = "ZK-Octopus: Privacy-Preserving Urban Credential Prototype"
authors  = ["Kurt Pan", "XU Pei"]
license  = "MIT"

[[bin]]
name = "zk-octopus"
path = "src/main.rs"

[dependencies]
clap        = { version = "4", features = ["derive"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sha2        = "0.10"
hex         = "0.4"
chrono      = { version = "0.4", features = ["serde"] }
rand        = "0.8"
anyhow      = "1"
